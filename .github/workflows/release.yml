name: Publish APK release

on:
  push:
    branches: [ main ]
    paths:
      - 'releases/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify artifact and checksums
        run: |
          set -euo pipefail
          ls -la releases/
          sha256sum releases/*.apk | tee releases/SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '(?<=versionName = ")[^"]+' app/build.gradle.kts | head -1)
          TAG="v${VERSION}"
          echo "Publishing ${TAG}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" releases/*.apk releases/SHA256SUMS.txt --clobber
          else
            gh release create "${TAG}" releases/*.apk releases/SHA256SUMS.txt \
              --title "Fly ${VERSION}" \
              --notes "Fly ${VERSION}: generative wallpaper studio, runtime theme engine, icon pack browser, widget pinning and animation studio.

          - Signed release APK, certificate CN=Fly
          - minSdk 24, targetSdk 34, arm64-v8a / armeabi-v7a / x86_64
          - Verify the download with SHA256SUMS.txt"
          fi
