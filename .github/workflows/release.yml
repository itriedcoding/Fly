name: Publish APK release

on:
  push:
    branches: [ main ]
    paths:
      - 'releases/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate the artifact for this version
        id: artifact
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '(?<=versionName = ")[^"]+' app/build.gradle.kts | head -1)
          APK="releases/Fly-${VERSION}.apk"
          test -f "${APK}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"
          sha256sum "${APK}" | tee releases/SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.artifact.outputs.version }}
          APK: ${{ steps.artifact.outputs.apk }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          echo "Publishing ${TAG} with ${APK}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${APK}" releases/SHA256SUMS.txt --clobber
          else
            gh release create "${TAG}" "${APK}" releases/SHA256SUMS.txt \
              --title "Fly ${VERSION}" \
              --notes "Fly ${VERSION}: twelve accents, sixteen stock themes, wallpaper matching, twelve animation presets, gallery export, icon pack browser with search, widget pinning and an in-app update checker.

          - Signed release APK, certificate CN=Fly
          - minSdk 24, targetSdk 34, arm64-v8a / armeabi-v7a / x86_64
          - Verify the download with SHA256SUMS.txt"
          fi
